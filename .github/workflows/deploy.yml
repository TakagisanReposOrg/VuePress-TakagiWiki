name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 贡献者按站点指南走 fork → PR 流程，且仓库 ruleset「Manage」强制走 PR，
  # 因此审计必须覆盖 pull_request，否则只能在合并之后才发现问题 —— 那时
  # main 已被污染，拦得住部署、拦不住坏合并。
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # 显式锁定 ubuntu-24.04：ubuntu-latest 将在 2026-10-19 迁移到 Ubuntu 26，
    # 发布流水线不宜在未验证的 OS 上自动跳转
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 必须显式声明 pnpm 版本：runner 上没有默认的 pnpm，
      # withastro/action 在缺少这一步时会报 "No pnpm version is specified."
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm verify = pnpm build && pnpm check
      # 审计不通过（退出码 1）时本作业失败。
      # 覆盖：页树漂移 / SEO 元信息 / sitemap 覆盖度 / 站内死链 / 锚点 /
      #       组件残留 / 静态资源缺失 / 混合内容 / 可访问性
      - name: Build and audit
        run: pnpm verify

      # 以下两项均只依赖 dist/，不联网，结果确定
      - name: Test audit rules
        run: pnpm test:audit

      - name: Test search index
        run: pnpm test:search

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    # PR 只做校验，不发布
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
